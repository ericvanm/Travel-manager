# Travel Manager — analyse SonarCloud / SonarQube
#
# ── SonarCloud (https://sonarcloud.io) — recommandé ─────────────────────
# Gratuit pour les dépôts publics GitHub.
#
# 1. Importer le repo sur https://sonarcloud.io (login GitHub)
# 2. Noter la clé d'organisation (Organization Key)
# 3. Secrets GitHub → Actions :
#      SONAR_TOKEN          → User Token SonarCloud (My Account → Security)
#                               ⚠ Pas un token GitHub — doit être créé sur sonarcloud.io
#                               Le compte doit être membre de l'organisation SonarCloud
#      SONAR_ORGANIZATION   → clé d'organisation SonarCloud
#    (GITHUB_TOKEN est fourni automatiquement par Actions)
#
# Le projectKey SonarCloud : {SONAR_ORGANIZATION}_Travel-manager
# Pour ce repo : ericvanm_Travel-manager (case sensitive)
# SONAR_ORGANIZATION doit valoir : ericvanm
#
# ── SonarQube Community self-hosted (alternative) ───────────────────────
# Utiliser docker-compose.sonar.yml + secrets :
#      SONAR_TOKEN, SONAR_HOST_URL (ex. http://localhost:9000)
# Remplacer le job sonarcloud par sonarqube-scan-action dans ci.yml.
#
# Instance locale : docker compose -f docker-compose.sonar.yml up -d

sonar.projectName=Travel Manager
sonar.sourceEncoding=UTF-8

sonar.sources=travelmgr backend,travelmgr frontend/src
sonar.tests=travelmgr backend/tests
sonar.test.inclusions=travelmgr backend/tests/**/*.test.js

sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/coverage/**,\
  **/build/**,\
  travelmgr backend/migrations/**,\
  travelmgr backend/controllers/unused/**,\
  **/*.lock,\
  **/package-lock.json

sonar.test.exclusions=\
  **/node_modules/**

sonar.javascript.lcov.reportPaths=travelmgr backend/coverage/lcov.info
sonar.typescript.tsconfigPath=travelmgr frontend/tsconfig.json

sonar.eslint.reportPaths=\
  travelmgr backend/eslint-report.json,\
  travelmgr frontend/eslint-report.json

# SonarCloud — décommenter pour un scan local (sonar-scanner-cli) :
# sonar.host.url=https://sonarcloud.io
# sonar.organization=ericvanm
# sonar.projectKey=ericvanm_Travel-manager
