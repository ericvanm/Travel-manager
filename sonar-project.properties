# SonarQube Community — Travel Manager (monorepo)
#
# Secrets GitHub requis :
#   SONAR_HOST_URL  → ex. http://localhost:9000 ou https://sonar.votredomaine.com
#   SONAR_TOKEN     → token généré dans SonarQube (My Account → Security)
#
# Instance locale : docker compose -f docker-compose.sonar.yml up -d

sonar.projectKey=travel-manager
sonar.projectName=Travel Manager

sonar.sourceEncoding=UTF-8

sonar.sources=travelmgr backend,travelmgr frontend/src
sonar.tests=travelmgr backend/tests
sonar.test.inclusions=travelmgr backend/tests/**/*.test.js

sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/coverage/**,\
  **/build/**,\
  travelmgr backend/migrations/**,\
  travelmgr backend/controllers/unused/**,\
  **/*.lock,\
  **/package-lock.json

sonar.test.exclusions=\
  **/node_modules/**

sonar.javascript.lcov.reportPaths=travelmgr backend/coverage/lcov.info
sonar.typescript.tsconfigPath=travelmgr frontend/tsconfig.json

# ESLint (rapports optionnels — générés en CI si présents)
sonar.eslint.reportPaths=\
  travelmgr backend/eslint-report.json,\
  travelmgr frontend/eslint-report.json
