# Travel Manager — SonarCloud / SonarQube analysis
#
# ── SonarCloud (https://sonarcloud.io) — recommended for public GitHub repos ──
#
# 1. Import the repo at https://sonarcloud.io (GitHub login)
# 2. Note the organization key
# 3. GitHub → Settings → Secrets → Actions:
#      SONAR_TOKEN          → SonarCloud user token (My Account → Security)
#                               Not a GitHub token — create at sonarcloud.io
#      SONAR_ORGANIZATION   → SonarCloud organization key
#    (GITHUB_TOKEN is provided automatically by Actions)
#
# Project key pattern: {SONAR_ORGANIZATION}_Travel-manager
# Example for this repo: ericvanm_Travel-manager (case sensitive)
#
# ── Self-hosted SonarQube Community (optional) ───────────────────────────────
# Use docker-compose.sonar.yml + secrets SONAR_TOKEN, SONAR_HOST_URL
# Replace the sonarcloud job with sonarqube-scan-action in ci.yml if needed.
#
# Local instance: docker compose -f docker-compose.sonar.yml up -d

sonar.projectName=Travel Manager
sonar.sourceEncoding=UTF-8

sonar.sources=travelmgr-backend,travelmgr-frontend/src
sonar.tests=travelmgr-backend/tests
sonar.test.inclusions=travelmgr-backend/tests/**/*.test.js

sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/coverage/**,\
  **/build/**,\
  travelmgr-backend/migrations/**,\
  **/*.lock,\
  **/package-lock.json

sonar.test.exclusions=\
  **/node_modules/**

sonar.javascript.lcov.reportPaths=travelmgr-backend/coverage/lcov.info
sonar.coverage.exclusions=\
  travelmgr-frontend/**,\
  travelmgr-backend/migrations/**,\
  travelmgr-backend/tests/**
sonar.typescript.tsconfigPath=travelmgr-frontend/tsconfig.json

sonar.eslint.reportPaths=\
  travelmgr-backend/eslint-report.json,\
  travelmgr-frontend/eslint-report.json

# SonarCloud — uncomment for local sonar-scanner-cli:
# sonar.host.url=https://sonarcloud.io
# sonar.organization=YOUR_SONAR_ORG
# sonar.projectKey=YOUR_SONAR_ORG_Travel-manager
