# SonarQube Community Edition — optional self-hosted alternative to SonarCloud
# SonarCloud (cloud): https://sonarcloud.io — see sonar-project.properties
#
# Start:
#   docker compose -f docker-compose.sonar.yml up -d
#
# UI: http://localhost:9000  (admin / admin on first login)
#
# Create a project with key YOUR_ORG_Travel-manager (case sensitive), then:
#   docker run --rm -e SONAR_HOST_URL=http://host.docker.internal:9000 \
#     -e SONAR_TOKEN=<token> -v "${PWD}:/usr/src" sonarsource/sonar-scanner-cli

services:
  sonarqube:
    image: sonarqube:community
    container_name: travel-mgr-sonarqube
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
