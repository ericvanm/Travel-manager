services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: travel_mgr
    container_name: travel-mgr-db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: travel-mgr-back-dev
    build:
      context: ./travelmgr backend
      dockerfile: dev.Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:mypassword@db:5432/travel_mgr
      SECRET: dev-secret-key
      PORT: 3001
    volumes:
      - ./travelmgr backend:/usr/src/app
      - /usr/src/app/node_modules
      - backend_node_modules:/usr/src/app/node_modules
    container_name: travel-mgr-back-dev
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3001:3001"

  app:
    image: travel-mgr-front-dev
    build:
      context: ./travelmgr frontend
      dockerfile: ./dev.Dockerfile
    environment:
      VITE_BACKEND_URL: http://localhost:8080/api
    volumes:
      - ./travelmgr frontend:/usr/src/app
      - /usr/src/app/node_modules
    container_name: travel-mgr-front-dev
    depends_on:
      - backend
    ports:
      - "5173:5173"

  nginx:
    image: nginx:1.20.1
    volumes:
      - ./nginx.dev.conf:/etc/nginx/nginx.conf:ro
    ports:
      - 8080:80
    container_name: reverse-proxy
    depends_on:
      - app
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  backend_node_modules: