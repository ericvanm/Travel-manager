services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: travel_mgr
    container_name: travel-mgr-db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: travel-mgr-back
    build:
      context: ./travelmgr-backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:mypassword@db:5432/travel_mgr
      SECRET: prod-secret-key
      PORT: 3001
    container_name: travel-mgr-back
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  app:
    image: travel-mgr-front
    build:
      context: ./travelmgr-frontend
      dockerfile: ./Dockerfile
    environment:
      VITE_BACKEND_URL: http://localhost:8080/api
    container_name: travel-mgr-front
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:1.20.1
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - 8080:80
    container_name: reverse-proxy
    depends_on:
      - app
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
