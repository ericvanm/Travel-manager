version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: "/travelmgr-backend"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    ignore:
      # ESLint 9 flat config — @eslint/js v10 requires ESLint 10 migration.
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      # OpenAI SDK v7 may break existing AI integration — upgrade manually with tests.
      - dependency-name: "openai"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: "/travelmgr-frontend"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    ignore:
      # @typescript-eslint v8 supports TypeScript <6.1 only (no TS 6/7 yet).
      - dependency-name: "typescript"
        versions: [">=6"]
      # Stay on MUI X v8 until @mui/material is upgraded past v5.
      - dependency-name: "@mui/x-date-pickers"
        update-types: ["version-update:semver-major"]
      # ESLint 9 flat config — @eslint/js v10 requires ESLint 10 migration.
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      # Vitest v4 — major bump; upgrade manually with test suite review.
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      # Removed: navigation is state-based in App.tsx (no React Router).
      - dependency-name: "react-router-dom"
      - dependency-name: "react-router"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch