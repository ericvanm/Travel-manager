version: 2

updates:
  - package-ecosystem: npm
    directory: "/travelmgr-backend"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: "/travelmgr-frontend"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    ignore:
      # @typescript-eslint v8 supports TypeScript <6.1 only — block major bumps (6.x, 7.x).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # eslint-plugin-react-refresh 0.5.x requires ESLint 9+; stay on 0.4.x until ESLint upgrade.
      - dependency-name: "eslint-plugin-react-refresh"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch