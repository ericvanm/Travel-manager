version: 2

updates:
  - package-ecosystem: npm
    directory: "/travelmgr-backend"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: "/travelmgr-frontend"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    ignore:
      # @typescript-eslint v8 supports TypeScript <6.1 only (no TS 6/7 yet).
      - dependency-name: "typescript"
        versions: [">=6"]
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch