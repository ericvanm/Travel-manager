name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  backend:
    name: Backend lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: travelmgr-backend
    env:
      CI_POSTGRES_USER: postgres
      CI_POSTGRES_PWD: postgres
      CI_POSTGRES_DB: travel_mgr_test
      NODE_ENV: test
      SECRET: ci-test-secret
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ${{ env.CI_POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.CI_POSTGRES_PWD }}
          POSTGRES_DB: ${{ env.CI_POSTGRES_DB }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - name: Configure test database URLs
        run: |
          echo "TEST_DATABASE_URL=postgres://${CI_POSTGRES_USER}:${CI_POSTGRES_PWD}@localhost:5432/${CI_POSTGRES_DB}" >> "$GITHUB_ENV"
          echo "DATABASE_URL=postgres://${CI_POSTGRES_USER}:${CI_POSTGRES_PWD}@localhost:5432/${CI_POSTGRES_DB}" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: travelmgr-backend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: backend-coverage
          path: travelmgr-backend/coverage/lcov.info
          if-no-files-found: ignore

  frontend:
    name: Frontend lint, typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: travelmgr-frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: travelmgr-frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run tsc
      - run: npm run build
        env:
          VITE_BACKEND_URL: http://localhost:3001/api

  sonarcloud:
    name: SonarCloud analysis
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    # Dependabot PRs do not receive repository secrets (SONAR_TOKEN, SONAR_ORGANIZATION).
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - uses: actions/download-artifact@v5
        with:
          name: backend-coverage
          path: travelmgr-backend/coverage

      - name: Install backend dependencies
        working-directory: travelmgr-backend
        run: npm ci --ignore-scripts

      - name: Install frontend dependencies
        working-directory: travelmgr-frontend
        run: npm ci --ignore-scripts

      - name: Generate ESLint reports for SonarCloud
        run: |
          cd "$GITHUB_WORKSPACE/travelmgr-backend" && npm run lint:report
          cd "$GITHUB_WORKSPACE/travelmgr-frontend" && npm run lint:report

      - name: SonarCloud scan
        uses: SonarSource/sonarcloud-github-action@e44258b109568baa0df60ed515909fc6c72cba92 # v2.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ secrets.SONAR_ORGANIZATION }}_Travel-manager
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
