name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: write

jobs:
  backend:
    name: Backend lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: travelmgr backend
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: travel_mgr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      SECRET: ci-test-secret
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/travel_mgr_test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/travel_mgr_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: travelmgr backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: travelmgr backend/coverage/lcov.info
          if-no-files-found: ignore

  frontend:
    name: Frontend lint, typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: travelmgr frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: travelmgr frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run tsc
      - run: npm run build
        env:
          VITE_BACKEND_URL: https://travel-manager-wl5x.onrender.com/api

  sonarcloud:
    name: SonarCloud analysis
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: travelmgr backend/coverage

      - name: Install backend dependencies
        working-directory: travelmgr backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: travelmgr frontend
        run: npm ci

      - name: Generate ESLint reports for SonarCloud
        run: |
          cd "$GITHUB_WORKSPACE/travelmgr backend" && npm run lint:report
          cd "$GITHUB_WORKSPACE/travelmgr frontend" && npm run lint:report

      - name: SonarCloud scan
        uses: SonarSource/sonarcloud-github-action@v2.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=travel-manager

      - name: SonarCloud quality gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
