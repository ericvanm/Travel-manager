# Render Blueprint — backend + PostgreSQL
# https://render.com/docs/blueprint-spec
#
# Deploy:
#   1. Connect the GitHub repo at https://dashboard.render.com/blueprints
#   2. After Vercel deploy, set CORS_ORIGINS to the frontend URL
#      (e.g. https://travel-manager.vercel.app)
#   3. Optionally set DEMO_USER_PASSWORD and ALLOW_REGISTRATION in the dashboard

databases:
  - name: travel-mgr-db
    databaseName: travel_mgr
    user: travel_mgr
    plan: free

services:
  - type: web
    name: travel-manager-api
    runtime: node
    rootDir: travelmgr-backend
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: travel-mgr-db
          property: connectionString
      - key: SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: CORS_ALLOW_HOSTED_SUFFIXES
        value: "true"
      - key: ALLOW_REGISTRATION
        value: "false"
      - key: DEMO_USER_PASSWORD
        sync: false
      - key: USE_OPENAI
        value: "false"
